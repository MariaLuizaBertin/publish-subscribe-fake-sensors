spring.application.name=publish-subscribe-fake-sensors

# Conexao com o RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Simulador de dispositivos
# Lista de pacientes monitorados (separados por virgula)
monitoramento.pacientes=paciente1,paciente2, paciente3, paciente4, paciente5
# Intervalo entre ciclos de leitura (ms)
monitoramento.intervalo-ms=3000

# Painel Movel — limite de alertas criticos por paciente no historico (escalabilidade)
monitoramento.movel.historico-limite=50
