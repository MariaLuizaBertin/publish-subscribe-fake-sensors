<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar - Painel Médico</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="./padrao.css">
    <link rel="stylesheet" href="./medico.css">
</head>

<body>
    <header>
        <a href="./index.html"><img src="./favicon.ico"></a>
        <nav>
            <a href="./index.html">Painel Enfermagem</a>
            <a>Painel Médico</a>
            <a href="./movel.html">Painel Móvel</a>
        </nav>
    </header>
    <main>
        <div class="seletor">
            <label for="paciente-select">Selecione o paciente:</label>
            <select id="paciente-select">
                <option value="">-- Escolha um paciente --</option>
            </select>
        </div>
        <div id="painel-container"></div>
        <section id="historico-container"></section>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
	let pacienteSelecionado = "";

	// estado local: { tipo -> { mensagem, prioridade, horario } }
	let sinaisAtuais = {};
	const historico = [];

	const rotulos = {
		temperatura: "Temperatura",
		pressao: "Pressão",
		spo2: "Saturação",
		bpm: "BPM"
	};

	function corPrioridade(prioridade) {
		if (prioridade === "critico") return "red";
		if (prioridade === "atencao") return "darkorange";
		return "inherit";
	}

	function linhaSinal(rotulo, sinal) {
		const valor = sinal?.mensagem ?? "-";
		const cor = corPrioridade(sinal?.prioridade);
		const condicao = sinal?.condicao && sinal?.prioridade !== "rotina" ? ` — ${sinal.condicao}` : "";
		return `<p style="color: ${cor}">${rotulo}: ${valor}${condicao}</p>`;
	}

	// preenche o <select> com os pacientes via REST (apenas 1x na inicialização)
	async function carregarPacientes() {
		const resposta = await fetch("/api/pacientes");
		const pacientes = await resposta.json();
		const select = document.getElementById("paciente-select");
		for (const p of pacientes) {
			const opt = document.createElement("option");
			opt.value = p;
			opt.textContent = p;
			select.appendChild(opt);
		}
	}

	function renderizarPainel() {
		const container = document.getElementById("painel-container");
		const historicoContainer = document.getElementById("historico-container");

		if (!pacienteSelecionado) {
			container.innerHTML = `<p class="aviso">Selecione um paciente para monitorar os sinais vitais.</p>`;
			historicoContainer.innerHTML = "";
			return;
		}

		if (historico.length === 0 && Object.keys(sinaisAtuais).length === 0) {
			container.innerHTML = `<p class="aviso">Aguardando sinais vitais de ${pacienteSelecionado}...</p>`;
			historicoContainer.innerHTML = "";
			return;
		}

		container.innerHTML = `
			<div class="paciente">
				<p class="title">${pacienteSelecionado}</p>
				${linhaSinal("Temperatura", sinaisAtuais.temperatura)}
				${linhaSinal("Pressão",     sinaisAtuais.pressao)}
				${linhaSinal("Saturação",   sinaisAtuais.spo2)}
				${linhaSinal("BPM",         sinaisAtuais.bpm)}
			</div>
		`;

		const linhasHistorico = [...historico]
			.reverse()
			.map(item => `
				<tr style="color: ${corPrioridade(item.prioridade)}">
					<td>${item.horario ?? "-"}</td>
					<td>${rotulos[item.tipo] ?? item.tipo}</td>
					<td>${item.mensagem}</td>
					<td>${item.condicao || "-"}</td>
					<td>${item.prioridade}</td>
				</tr>
			`)
			.join("");

		historicoContainer.innerHTML = `
			<h2>Histórico de Medições (${historico.length})</h2>
			<div class="tabela-wrapper">
				<table>
					<thead><tr>
						<th>Horário</th><th>Sinal</th><th>Medição</th><th>Condição</th><th>Prioridade</th>
					</tr></thead>
					<tbody>${linhasHistorico}</tbody>
				</table>
			</div>
		`;
	}

	// ── WebSocket ──────────────────────────────────────────────────
	let stompClient = null;
	let subscricaoPaciente = null;

	function conectarWebSocket() {
		const socket = new SockJS("/ws");
		stompClient = Stomp.over(socket);
		stompClient.debug = null;
		stompClient.connect({}, () => {
			if (pacienteSelecionado) assinarPaciente(pacienteSelecionado);
		}, () => setTimeout(conectarWebSocket, 3000));
	}

	// carga inicial via REST ao selecionar um paciente para trazer últimos sinais e histórico prévio
	async function carregarInicialPaciente(paciente) {
		const resposta = await fetch(`/api/medico?paciente=${encodeURIComponent(paciente)}`);
		const dados = await resposta.json();
		if (paciente !== pacienteSelecionado) return;

		sinaisAtuais = { ...(dados.ultimosSinais ?? {}) };
		historico.length = 0;
		for (const item of dados.historico ?? []) {
			historico.push(item);
		}
		renderizarPainel();
	}

	async function assinarPaciente(paciente) {
		if (subscricaoPaciente) { subscricaoPaciente.unsubscribe(); subscricaoPaciente = null; }
		sinaisAtuais = {};
		historico.length = 0;
		renderizarPainel();

		if (!paciente) return;

		await carregarInicialPaciente(paciente);
		if (paciente !== pacienteSelecionado || !stompClient?.connected) return;

		subscricaoPaciente = stompClient.subscribe(`/topic/paciente/${paciente}`, (msg) => {
			const leitura = JSON.parse(msg.body);
			if (leitura.paciente !== pacienteSelecionado) return;

			sinaisAtuais[leitura.tipo] = leitura;
			historico.push({ ...leitura, horario: leitura.horario ?? new Date().toLocaleTimeString() });
			renderizarPainel();
		});
	}

	document.getElementById("paciente-select").addEventListener("change", (event) => {
		pacienteSelecionado = event.target.value;
		assinarPaciente(pacienteSelecionado);
	});

	carregarPacientes();
	renderizarPainel();
	conectarWebSocket();
</script>

</html>
